name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          SESSION_SECRET: ci-session-secret-with-more-than-thirty-two-characters
          DEV_BYPASS_AUTH: "true"
          GATEWAY_BASE_URL: https://homepilot-ai.shares.zrok.io/v1
          GATEWAY_MODEL: gpt-5.4-mini
        run: npm run build
