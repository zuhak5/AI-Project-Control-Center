name: Generate dependency lock

on:
  push:
    branches: [agent/deep-bug-review]

permissions:
  contents: write

concurrency:
  group: generate-lock-agent-deep-bug-review
  cancel-in-progress: true

jobs:
  lock:
    if: github.actor == 'zuhak5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/deep-bug-review
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Generate lockfile without dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add reproducible dependency lock"
          git push origin HEAD:agent/deep-bug-review
